<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администратор · 30 тайн судьбы</title><style>body{font:15px/1.5 system-ui;background:#141021;color:#f8eafc;margin:0;padding:24px}main{max-width:1200px;margin:auto}input,button{padding:11px;border-radius:8px;border:1px solid #806995;margin:5px;background:#302540;color:white}button{cursor:pointer;background:#6a4a80}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #594668;padding:10px;text-align:left}a{color:#f5d08a}.scroll{overflow:auto}.paid{color:#8ff0b7}.pending{color:#f7d18a}</style><main><h1>✦ Заказы · 30 тайн судьбы</h1><p>Введите секрет администратора (он не сохраняется в браузере). Подтверждайте оплату только после сверки банковской выписки.</p><input id="token" type="password" style="width:min(450px,90%)" placeholder="ORACLE_ADMIN_TOKEN"><button id="load">Обновить заказы</button><p id="msg"></p><div class="scroll"><table><thead><tr><th>Заказ</th><th>Имя / WhatsApp</th><th>Статус</th><th>Операции</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const $=x=>document.getElementById(x);function h(tag,text){let e=document.createElement(tag);e.textContent=text;return e}async function request(path,method='GET',data){let r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.error||'Ошибка '+r.status)}return r}async function load(){try{let data=await(await request('/api/admin/orders')).json();$('rows').replaceChildren();for(let o of data.orders){let tr=h('tr','');let id=h('td',o.id+' · '+o.created_at.slice(0,16));let user=h('td',o.name+' · +'+o.phone);let status=h('td',o.status);status.className=o.status;let actions=h('td','');if(o.status==='pending'){let b=h('button','Подтвердить платёж');b.onclick=async()=>{let ref=prompt('Укажите банковский идентификатор операции. Убедитесь в поступлении 399 сом на счёт.');if(!ref)return;try{await request('/api/admin/confirm/'+encodeURIComponent(o.id),'POST',{payment_reference:ref});load()}catch(e){alert(e.message)}};actions.append(b)}if(o.status==='paid'||o.status==='sent'){let pdf=h('button','Скачать PDF');pdf.onclick=async()=>{try{let r=await request('/api/admin/pdf/'+encodeURIComponent(o.id));let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='30_tain_'+o.id+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){alert(e.message)}};actions.append(pdf);let wa=h('button','Открыть WhatsApp');wa.onclick=()=>{let msg='Здравствуйте, '+o.name+'! Оплата заказа '+o.id+' подтверждена. Спасибо за покупку! Прикрепляем ваше персональное предсказание в PDF.';window.open('https://wa.me/'+o.phone+'?text='+encodeURIComponent(msg),'_blank','noopener');alert('Скачайте PDF отдельной кнопкой и вручную прикрепите его к сообщению WhatsApp.')};actions.append(wa);let auto=h('button','Отправить через API');auto.onclick=async()=>{if(!confirm('Официальный API подключён и 24-часовое окно общения действительно открыто?'))return;try{let r=await request('/api/admin/send-whatsapp/'+encodeURIComponent(o.id),'POST',{});alert(JSON.stringify(await r.json()));load()}catch(e){alert(e.message)}};actions.append(auto)}tr.append(id,user,status,actions);$('rows').append(tr)}$('msg').textContent='Заказов: '+data.orders.length}catch(e){$('msg').textContent=e.message}}$('load').onclick=load;</script></html>
